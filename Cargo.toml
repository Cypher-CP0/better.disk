[workspace]
resolver = "3"
members = [
    "crates/bd-core",
    "crates/bd-win",
    "spikes/bd-spike-scan",
    "spikes/bd-spike-recycle",
    "spikes/bd-spike-query",
    "tools/bd-fixtures",
    "app/src-tauri",
]
# The Tauri app needs the built frontend and (on Linux) WebKitGTK system
# libraries, so plain `cargo test` at the root skips it. Build it explicitly
# with `cargo build -p bd-app` after `npm run build` in app/.
default-members = [
    "crates/bd-core",
    "crates/bd-win",
    "spikes/bd-spike-scan",
    "spikes/bd-spike-recycle",
    "spikes/bd-spike-query",
    "tools/bd-fixtures",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bd-core = { path = "crates/bd-core" }
bd-win = { path = "crates/bd-win" }
bd-fixtures = { path = "tools/bd-fixtures" }

clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

tauri = "2.11.6"
tauri-build = "2.6.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
