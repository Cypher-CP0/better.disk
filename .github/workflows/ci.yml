name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Fixture round trip with the portable reader
        run: |
          cargo build --release --locked -p bd-fixtures -p bd-spike-scan -p bd-spike-query
          ./target/release/bd-fixtures create "$RUNNER_TEMP/fixture" --bulk-files 5000 --bulk-bytes 50MB
          ./target/release/bd-spike-scan "$RUNNER_TEMP/fixture" --verify all --quiet --json scan-linux.report.json
          ./target/release/bd-spike-query --files 100000 --json query-linux.report.json
          ./target/release/bd-fixtures clean "$RUNNER_TEMP/fixture"
      - uses: actions/upload-artifact@v7
        with:
          name: stage0-linux
          path: "*.report.json"

  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  windows:
    name: Windows (native reader, Shell, app)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the frontend (the app embeds it)
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build spikes
        run: cargo build --release --locked -p bd-fixtures -p bd-spike-scan -p bd-spike-query -p bd-spike-recycle
      - name: Fixture, native scan, manifest check and full verification
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP "fixture"
          ./target/release/bd-fixtures.exe create $fx --bulk-files 20000 --bulk-bytes 200MB
          ./target/release/bd-spike-scan.exe $fx --verify all --quiet --json scan-native.report.json
          if ($LASTEXITCODE -ne 0) { throw "manifest checks failed" }
          ./target/release/bd-spike-scan.exe $fx --reader full --quiet --json scan-full.report.json
          ./target/release/bd-spike-scan.exe $fx --reader std --no-manifest --quiet --json scan-std.report.json
          ./target/release/bd-spike-scan.exe $fx --workers 1,2,4 --repeat 2 --no-manifest --quiet --json scan-workers.report.json
          ./target/release/bd-spike-scan.exe $fx --cancel-after-ms 50 --no-manifest --quiet --json scan-cancel.report.json
          ./target/release/bd-fixtures.exe clean $fx
      - name: Query benchmark
        run: ./target/release/bd-spike-query.exe --files 100000 --json query-windows.report.json
      - name: Shell smoke run (startup, IPC permissions, security probe)
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location app
          npm run build:exe
          Pop-Location
          $env:BD_STARTUP_REPORT = "$PWD/app-startup.report.json"
          $env:BD_RESULTS_FILE = "$PWD/app-results.report.json"
          $p = Start-Process -FilePath target/release/bd-app.exe -PassThru
          Start-Sleep -Seconds 15
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content app-startup.report.json, app-results.report.json -ErrorAction Continue
      - name: Recycle spike in a sandbox (informational on CI)
        continue-on-error: true
        shell: pwsh
        run: |
          $sb = Join-Path $env:RUNNER_TEMP "sandbox"
          ./target/release/bd-fixtures.exe recycle-sandbox $sb
          ./target/release/bd-spike-recycle.exe $sb --silent --json recycle-ci.report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage0-windows
          path: "*.report.json"
